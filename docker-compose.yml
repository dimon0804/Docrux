# Запуск: docker compose up --build
# Сервис откроется на http://localhost:8080

name: paragraf

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *hardening
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
    image: paragraf-api:latest
    environment:
      PARAGRAF_TRUST_PROXY: "true"
      PARAGRAF_RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      PARAGRAF_MAX_UPLOAD_MB: "15"
      # Необязательная модель рукописного текста: см. раздел «Рукописный текст» в README.
      PARAGRAF_HANDWRITING_MODEL: ${HANDWRITING_MODEL:-}
      # Вопросы голосом: модель Vosk в models/speech-ru (python tools/fetch_models.py speech).
      # Если папки нет, кнопка микрофона просто не появляется.
      PARAGRAF_SPEECH_MODEL: ${SPEECH_MODEL:-/models/speech-ru}
      # Счётчики Prometheus от всех процессов uvicorn собираются в одной папке в tmpfs.
      PROMETHEUS_MULTIPROC_DIR: /tmp/metrics
    volumes:
      - ./models:/models:ro
    # Временные файлы OCR живут только в памяти и исчезают вместе с контейнером.
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: ${API_MEMORY:-2g}
    cpus: ${API_CPUS:-2.0}
    networks: [internal]
    expose: ["8000"]

  web:
    <<: *hardening
    build:
      context: frontend
    image: paragraf-web:latest
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
      API_UPSTREAM: api:8000
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    # Для домена с HTTPS подключите том к /tmp/caddy/data, чтобы сертификаты переживали перезапуск.
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 256m
    networks: [internal, public]

  # Telegram-бот: BOT_TOKEN=... docker compose --profile bot up -d --build
  bot:
    <<: *hardening
    profiles: [bot]
    image: paragraf-api:latest
    # Образ собирает сервис api, скачивать его неоткуда.
    pull_policy: never
    command: ["paragraf", "bot"]
    # Без токена или с неверным токеном бот завершается с ошибкой: несколько попыток,
    # а не бесконечный перезапуск.
    restart: "on-failure:3"
    environment:
      # Compose подставляет переменные во весь файл, даже в выключенные профили, поэтому
      # обязательность здесь сломала бы обычный docker compose up. Без токена бот сам
      # завершается с понятной ошибкой: docker compose logs bot.
      PARAGRAF_BOT_TOKEN: ${BOT_TOKEN:-}
      # Адрес сайта по HTTPS: бот откроет сервис прямо в Telegram.
      PARAGRAF_BOT_WEB_APP_URL: ${WEB_APP_URL:-}
      PARAGRAF_MAX_UPLOAD_MB: "15"
      PARAGRAF_HANDWRITING_MODEL: ${HANDWRITING_MODEL:-}
    volumes:
      - ./models:/models:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    # HTTP-сервера в боте нет, проверка из образа API к нему не подходит.
    healthcheck:
      disable: true
    mem_limit: ${BOT_MEMORY:-2g}
    cpus: ${BOT_CPUS:-2.0}
    # Боту нужен выход в интернет к api.telegram.org, а сеть internal его не даёт.
    # С API и веб-сервером бот не общается, поэтому у него своя сеть.
    networks: [egress]


  # Мониторинг: docker compose --profile monitoring up -d, панель на http://localhost:3000
  prometheus:
    <<: *hardening
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    tmpfs:
      - /prometheus:size=256m,uid=65534,gid=65534
    mem_limit: 512m
    networks: [internal]

  grafana:
    <<: *hardening
    profiles: [monitoring]
    image: grafana/grafana-oss:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-paragraf}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/paragraf.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Файловая система контейнера только для чтения: база и плагины в tmpfs, журнал в консоль.
      GF_PATHS_DATA: /var/lib/grafana/data
      GF_PATHS_PLUGINS: /var/lib/grafana/data/plugins
      GF_LOG_MODE: console
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    tmpfs:
      - /var/lib/grafana/data:size=128m,uid=472,gid=0
      - /tmp:size=64m,mode=1777
    mem_limit: 512m
    ports:
      - "127.0.0.1:3000:3000"
    networks: [internal, monitoring]

networks:
  internal:
    internal: true
  public:
  egress:
  monitoring:
