# Запуск: docker compose up --build
# Сервис откроется на http://localhost:8080

name: paragraf

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *hardening
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
    image: paragraf-api:latest
    environment:
      PARAGRAF_TRUST_PROXY: "true"
      PARAGRAF_RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      PARAGRAF_MAX_UPLOAD_MB: "15"
    # Временные файлы OCR живут только в памяти и исчезают вместе с контейнером.
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 2g
    cpus: 2.0
    networks: [internal]
    expose: ["8000"]

  web:
    <<: *hardening
    build:
      context: frontend
    image: paragraf-web:latest
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
      API_UPSTREAM: api:8000
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    # Для домена с HTTPS подключите том к /tmp/caddy/data, чтобы сертификаты переживали перезапуск.
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 256m
    networks: [internal, public]

networks:
  internal:
    internal: true
  public:
