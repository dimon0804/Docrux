name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev,bot]" pip-audit
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Tests
        run: pytest --cov=docrux --cov-report=term-missing
      - name: Dependency audit
        run: pip-audit --strict --skip-editable
        continue-on-error: true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  accuracy:
    name: OCR accuracy on the open set
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: docrux-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Recognize 30 documents and answer 120 questions
        run: |
          mkdir -p out && chmod 777 out
          # Запуск от пользователя образа и с теми же ограничениями, что в docker-compose.
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL \
            -v "$PWD/data/open:/data:ro" -v "$PWD/out:/out" docrux-api:ci \
            docrux batch /data/documents.json --out /out/results.json
      - name: Compare with the reference
        run: |
          python data/open/evaluate.py \
            --reference data/open/reference_results.json \
            --predictions out/results.json --report report.json
          python - <<'PY'
          import json, sys
          report = json.load(open("report.json"))
          metrics = ["field_accuracy_macro", "validation_exact_match", "question_exact_match"]
          print({name: report[name] for name in metrics})
          sys.exit(0 if all(report[name] == 1.0 for name in metrics) else 1)
          PY

  stack:
    name: Full stack through docker compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack the way the jury will
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Read a document through the gateway
        run: |
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/health
          curl -fsS -F "file=@data/open/documents/open-010.png"             -F "question=Что это за документ?"             http://localhost:8080/api/analyze > analyze.json
          python - <<'PY'
          import json
          body = json.load(open("analyze.json", encoding="utf-8"))
          analysis = body["analysis"]
          assert analysis["document_type"] == "study_certificate", analysis["document_type"]
          assert set(analysis["validation"]["missing_fields"]) == {"signature_present", "seal_present"}
          assert body["check"]["sources"] == ["rule:3.2", "rule:3.3"]
          assert body["answer"]["intent"] == "about" and "справка об обучении" in body["answer"]["answer"]
          print("stack answers correctly")
          PY
      - name: The API must not be reachable from outside
        run: |
          if curl -fsS -m 5 http://localhost:8000/api/health; then exit 1; fi
      - name: Containers run without root
        run: |
          test "$(docker compose exec -T api id -u)" != "0"
          test "$(docker compose exec -T web id -u)" != "0"
      - name: Logs
        if: always()
        run: docker compose logs --tail 80

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Vulnerabilities and misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
