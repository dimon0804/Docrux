# Заявление на академический отпуск.
id: academic_leave_application
title: Заявление на академический отпуск
detect:
  titles: ["заявление на академический отпуск", "заявление о предоставлении академического отпуска"]
  keywords: ["академический отпуск", "причина отпуска", "учебная группа", "прошу предоставить", "заявление", "прошу"]
fields:
  - key: student_name
    label: ФИО студента
    type: person
    rule: "4.1"
    aliases: ["ФИО", "Фамилия, имя, отчество", "Студент", "От студента", "Обучающийся", "ФИО обучающегося", "Фамилия Имя Отчество"]
    ask: ["как зовут студента", "кто подал заявление", "от кого заявление", "фамилия студента"]
  - key: group
    label: Учебная группа
    type: code
    rule: "4.1"
    aliases: ["Группа", "Академическая группа", "Номер группы", "Шифр группы", "Учебная группа №"]
    ask: ["в какой группе учится студент", "какая группа у студента"]
  - key: course
    label: Курс
    type: integer
    rule: "4.1"
    aliases: ["Курс обучения"]
    ask: ["на каком курсе учится студент", "какой курс у студента"]
  - key: leave_reason
    label: Причина отпуска
    type: text
    rule: "4.1"
    aliases: ["Причина", "Основание", "Причина академического отпуска"]
    ask: ["почему студент берёт отпуск", "по какой причине отпуск", "основание отпуска"]
  - key: leave_start
    label: Дата начала отпуска
    type: date
    rule: "4.1"
    aliases: ["Начало отпуска", "Отпуск с"]
    ask: ["когда начинается отпуск", "с какой даты отпуск", "с какого числа отпуск"]
  - key: leave_end
    label: Дата окончания отпуска
    type: date
    rule: "4.1"
    aliases: ["Окончание отпуска", "Отпуск по"]
    ask: ["когда заканчивается отпуск", "до какой даты отпуск", "по какое число отпуск"]
  - key: application_date
    label: Дата заявления
    type: date
    rule: "4.1"
    aliases: ["Дата", "Дата подачи", "Дата подачи заявления", "Дата составления"]
    ask: ["когда написано заявление", "какого числа подано заявление"]
  - key: signature_present
    label: Подпись студента
    type: mark
    mark: signature
    rule: "4.2"
    aliases: ["Подпись"]
    ask: ["есть ли подпись", "подписано ли заявление", "стоит ли подпись студента"]
composites:
  - label: Группа и курс
    aliases: ["Курс и группа"]
    kind: group_and_course
    keys: [group, course]
  - label: Период отпуска
    aliases: ["Срок отпуска", "Сроки отпуска"]
    kind: date_range
    keys: [leave_start, leave_end]

# Образцы фраз для заявлений свободной формы. Готовые куски: {fio}, {date}, {name}, {code}.
freeform:
  student_name:
    patterns:
      - '(?i:от\s+студент\w+|от\s+обучающ\w+|студент\w+|от)\s+(?:(?i:\d[\s-]*(?:го)?\s*курса|группы\s+\S+|гр\.\s*\S+|очной\s+формы\s+обучения|,)\s*)*(?P<value>{fio})'
  group:
    patterns:
      - '(?i)(?:групп[аыеу]|гр\.)\s*[:№]?\s*(?P<value>[А-ЯЁA-Z]{1,6}[\s-]?\d{1,3}(?:[\s-]\d{1,3})?[А-Яа-я]?)'
  course:
    patterns:
      - '(?i)(?P<value>\d)\s*(?:-?\s*(?:го|й|ого))?\s*курса?\b'
      - '(?i)курс\w*\s*[:\-–]?\s*(?P<value>\d)'
  leave_reason:
    patterns:
      - '(?i)(?P<value>(?:в\s+связи\s+с|по\s+состоянию|по\s+семейным|по\s+медицинским|по\s+причине|для\s+прохождения)\s[^.;]{3,100}?)(?=\s+с\s+[«"]?\d|[.;]|$)'
  leave_start:
    patterns:
      - '(?i)отпуск\w*\b[^.]{0,200}?\bс\s+(?P<value>{date})'
  leave_end:
    patterns:
      - '(?i)отпуск\w*\b[^.]{0,200}?\bс\s+{date}\s*(?:по|до|[-–—])\s*(?P<value>{date})'
  application_date:
    patterns:
      - '(?i)дата\s*[:\-–]?\s*(?P<value>{date})'
      - '(?P<value>{date})\s*(?:г\.?)?\s*(?:_{3,}|(?i:подпись))'
