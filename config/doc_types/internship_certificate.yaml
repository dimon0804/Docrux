# Справка о практике.
id: internship_certificate
title: Справка о практике
detect:
  titles: ["справка о практике", "справка о прохождении практики"]
  keywords: ["название организации", "руководитель практики", "оценка", "прохождении практики"]
fields:
  - key: student_name
    label: ФИО студента
    type: person
    rule: "5.1"
    aliases: ["ФИО", "Фамилия, имя, отчество", "Студент", "Практикант", "Обучающийся"]
    ask: ["как зовут студента", "кому выдана справка", "кто проходил практику", "фамилия студента"]
  - key: organization
    label: Название организации
    type: text
    rule: "5.1"
    aliases: ["Организация", "Наименование организации", "Место практики", "Место прохождения практики"]
    ask: ["где студент проходил практику", "в какой организации практика", "название компании"]
  - key: internship_start
    label: Дата начала практики
    type: date
    rule: "5.1"
    aliases: ["Начало практики", "Практика с"]
    ask: ["когда началась практика", "с какой даты практика", "с какого числа практика"]
  - key: internship_end
    label: Дата окончания практики
    type: date
    rule: "5.1"
    aliases: ["Окончание практики", "Практика по"]
    ask: ["когда закончилась практика", "до какой даты практика", "по какое число практика"]
  - key: supervisor_name
    label: ФИО руководителя практики
    type: person
    rule: "5.1"
    aliases: ["Руководитель практики", "Руководитель", "ФИО руководителя"]
    ask: ["кто руководил практикой", "как зовут руководителя практики", "кто руководитель"]
  - key: grade
    label: Оценка
    type: text
    rule: "5.1"
    aliases: ["Оценка за практику", "Итоговая оценка", "Результат"]
    ask: ["какую оценку получил студент", "что поставили за практику", "какая оценка за практику"]
  - key: document_number
    label: Номер справки
    type: code
    rule: "5.1"
    aliases: ["Номер", "Регистрационный номер", "Номер документа", "№"]
    ask: ["какой номер у справки", "номер документа"]
  - key: issue_date
    label: Дата выдачи
    type: date
    rule: "5.1"
    aliases: ["Выдана", "Дата выдачи справки", "Дата"]
    ask: ["когда выдана справка", "какого числа выдали документ"]
  - key: signature_present
    label: Подпись руководителя
    type: mark
    mark: signature
    rule: "5.2"
    aliases: ["Подпись", "Подпись руководителя практики"]
    ask: ["есть ли подпись", "подписана ли справка", "стоит ли подпись руководителя"]
  - key: seal_present
    label: Печать организации
    type: mark
    mark: seal
    rule: "5.3"
    aliases: ["М.П.", "Печать", "Место печати"]
    ask: ["есть ли печать", "стоит ли печать организации", "заверена ли справка печатью"]
composites:
  - label: Сроки практики
    aliases: ["Период практики", "Срок практики"]
    kind: date_range
    keys: [internship_start, internship_end]
  - label: Номер и дата выдачи
    aliases: ["Справка №"]
    kind: number_and_date
    keys: [document_number, issue_date]
