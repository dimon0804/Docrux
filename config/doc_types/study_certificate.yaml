# Справка об обучении.
# Новый тип документа добавляется таким же файлом: код менять не нужно.
id: study_certificate
title: Справка об обучении
detect:
  titles: ["справка об обучении", "справка с места учебы", "справка о периоде обучения", "справка об обучении в образовательной организации"]
  keywords: ["название вуза", "направление подготовки", "форма обучения", "период обучения", "обучается", "является студентом", "зачислен", "формы обучения"]
fields:
  - key: student_name
    label: ФИО студента
    type: person
    rule: "3.1"
    aliases: ["ФИО", "Фамилия, имя, отчество", "Студент", "Обучающийся"]
    ask: ["как зовут студента", "кому выдана справка", "на чьё имя документ", "фамилия студента"]
  - key: university
    label: Название вуза
    type: text
    rule: "3.1"
    aliases: ["Вуз", "Наименование вуза", "Образовательная организация", "Университет"]
    ask: ["какой вуз выдал справку", "в каком вузе учится студент", "где учится студент", "название университета"]
  - key: program
    label: Направление подготовки
    type: text
    rule: "3.1"
    aliases: ["Направление", "Специальность", "Направление подготовки (специальность)"]
    ask: ["на каком направлении учится студент", "какая специальность", "код направления"]
  - key: study_form
    label: Форма обучения
    type: text
    rule: "3.1"
    aliases: ["Форма"]
    ask: ["очно или заочно учится студент", "какая форма обучения"]
  - key: study_start
    label: Начало периода обучения
    type: date
    rule: "3.1"
    aliases: ["Начало обучения", "Дата начала обучения", "Период обучения с"]
    ask: ["когда началось обучение", "с какой даты учится студент", "с какого числа обучение"]
  - key: study_end
    label: Окончание периода обучения
    type: date
    rule: "3.1"
    aliases: ["Окончание обучения", "Дата окончания обучения", "Период обучения по"]
    ask: ["когда закончилось обучение", "до какой даты обучение", "по какое число обучение"]
  - key: document_number
    label: Номер справки
    type: code
    rule: "3.1"
    aliases: ["Номер", "Регистрационный номер", "Номер документа", "№"]
    ask: ["какой номер у справки", "номер документа"]
  - key: issue_date
    label: Дата выдачи
    type: date
    rule: "3.1"
    aliases: ["Выдана", "Дата выдачи справки", "Дата"]
    ask: ["когда выдана справка", "какого числа выдали документ"]
  - key: signature_present
    label: Подпись сотрудника
    type: mark
    mark: signature
    rule: "3.2"
    aliases: ["Подпись", "Подпись уполномоченного сотрудника"]
    ask: ["есть ли подпись", "подписана ли справка", "стоит ли подпись сотрудника"]
  - key: seal_present
    label: Печать вуза
    type: mark
    mark: seal
    rule: "3.3"
    aliases: ["М.П.", "Печать", "Место печати"]
    ask: ["есть ли печать", "стоит ли печать вуза", "заверена ли справка печатью"]
# Составные строки: одна метка на документе, несколько полей в карточке.
composites:
  - label: Период обучения
    aliases: ["Срок обучения", "Период"]
    kind: date_range
    keys: [study_start, study_end]
  - label: Номер и дата выдачи
    aliases: ["Справка №"]
    kind: number_and_date
    keys: [document_number, issue_date]

# Образцы фраз для справок свободной формы, где нет строк «Метка: значение».
# Значение берётся из группы value. Готовые куски: {fio}, {date}, {name}, {code}.
freeform:
  student_name:
    patterns:
      - '(?i:дана|выдана|выдаётся|выдается|предоставлена|подтверждает,?\s+что|в\s+том,?\s+что)\s+(?:(?i:настоящая|студент\w*|обучающ\w+|гр\.|гражданин\w*|гражданк\w*)\s+)*(?P<value>{fio})'
  university:
    patterns:
      - '(?P<value>(?:ФГБОУ|ФГАОУ|ГБОУ|ГАОУ|АНО|ЧОУ|НОУ|ГБПОУ|ФГКОУ)\s+(?:ВО|ВПО|СПО|ДПО)?\s*{name})'
      - '(?P<value>[А-ЯЁ][А-Яа-яЁё\- ]{3,80}?(?i:университет|институт|академия|колледж|техникум|училище)(?:\s+(?i:имени|им\.)\s+[А-ЯЁ][А-Яа-яЁё.]{2,25}(?:\s+[А-ЯЁ][А-Яа-яЁё.]{1,25})?)?(?:\s+{name})?)'
  program:
    patterns:
      - '(?P<value>\d{2}\.\d{2}\.\d{2}\s*[«"]?[А-ЯЁ][А-Яа-яЁё ,\-]{2,80}?)(?=[»".;(]|,\s|\s+(?i:форм|профил|очн|заочн|срок|курс)|$)'
      - '(?i:направлени\w+(?:\s+подготовки)?|специальност\w+)\s*[:\-–]?\s*(?P<value>{name})'
  study_form:
    patterns:
      - '(?i)(?P<value>очно[\s-]*заочн\w+|заочн\w+|очн\w+|вечерн\w+)\s+форм'
      - '(?i)форм\w+\s+обучения\s*[:\-–]?\s*(?P<value>очно[\s-]*заочн\w+|заочн\w+|очн\w+|вечерн\w+)'
    choices:
      'очно[\s-]*заочн': очно-заочная
      'заочн': заочная
      'очн': очная
      'вечерн': вечерняя
  study_start:
    patterns:
      - '(?i)(?:срок\w*|период\w*)\s+обучения\s*[:\-–]?\s*с\s+(?P<value>{date})'
      - '(?i)(?:зачислен\w*|обучается|обучал\w+)\b[^.]{0,120}?\bс\s+(?P<value>{date})'
      - '(?i)начал\w+\s+обучения\s*[:\-–]?\s*(?P<value>{date})'
  study_end:
    patterns:
      - '(?i)(?:срок\w*|период\w*)\s+обучения\s*[:\-–]?\s*с\s+{date}\s*(?:по|до|[-–—])\s*(?P<value>{date})'
      - '(?i)(?:зачислен\w*|обучается|обучал\w+)\b[^.]{0,120}?\bс\s+{date}\s*(?:по|до|[-–—])\s*(?P<value>{date})'
      - '(?i)(?:срок\w*|дат\w+)\s+окончани\w+(?:\s+обучения)?\s*[:\-–]?\s*(?P<value>{date})'
      - '(?i)окончани\w+\s+обучения\s*[:\-–]?\s*(?P<value>{date})'
  document_number:
    patterns:
      - '(?i)справка\s*№\s*(?P<value>{code})'
      - '(?i)(?:исх\.?|рег\.?|регистрационный)\s*№\s*(?P<value>{code})'
      - '№\s*(?P<value>{code})'
  issue_date:
    patterns:
      - '(?i)№\s*{code}\s*от\s*(?P<value>{date})'
      - '(?i)от\s*(?P<value>{date})\s*(?:г\.?)?\s*№'
      - '(?i)дата\s+выдачи\s*[:\-–]?\s*(?P<value>{date})'
