# Как студенты спрашивают о пунктах Положения своими словами.
#
# В Положении написано «максимальная длительность отпуска не установлена», а
# студент спросит «на сколько можно уйти в академ?». Здесь к номеру пункта
# привязаны короткие фразы из таких вопросов. Если все значимые слова фразы
# есть в вопросе, сервис отвечает дословной цитатой этого пункта.
#
# Файл можно дополнять без правок кода. Сервис ничего не сочиняет: ответом
# всегда остаётся текст самого пункта.

